
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Porta de Entrada</title>
</head>
<body>
    <header>
        <img src="assets/logo.png" alt="logo Smart Control">
    </header>

    <form method="get" action="dashboard.html">

        <label for="Nome">Nome Completo:</label>
        <input type="text" name="Nome" id="Nome" required>
        
        <label for="email">E-mail:</label>
        <input type="email" name="email" id="email" required>
        
        <label for="senha">senha:</label>
        <input type="password" name="senha" id="senha" minlength=8; required>

        <label for="senha2">Confirme senha:</label>
        <input type="password" name="senha2" id="senha2" minlength=8; required>

        <label for="Nivel">Selecione cargo</label>
        <select name="Nivel de Acesso" id="Nivel" required>
            <option value="" selected>Selecione</option>
            <option>Estagiário</option>
            <option>Junior</option>
            <option>Pleno</option>
            <option>Sênior</option>
        </select>

        <label for="Termos">Li e aceito os termos de uso.</label>
        <input type="checkbox" name="Termos" id="Termos">

        
        <button type="submit">Criar</button>
    </form>
<main>
    <footer>

        <h3>Localização</h3>

        <iframe src="https://www.google.com/maps/place/Praia+do+Arrombado/@-2.9117067,-41.5320791,17z/data=!3m1!4b1!4m6!3m5!1s0x7ec19f2c83cb9c1:0x3d9a3725062bfd22!8m2!3d-2.9117067!4d-41.5295042!16s%2Fg%2F11c0vwrhmh?entry=ttu&g_ep=EgoyMDI2MDcyMi4wIKXMDSoASAFQAw%3D%3D" frameborder="0"></iframe>

    </footer>
</main>
</body>
</html>
